<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>가입 — 무명</title>
<style>
:root{
  --bg:#F7F4EF;--bg-sunk:#EFEAE2;--surface:#FFFFFF;--border:#DED7CC;--border-strong:#C4BAAB;
  --ink:#23201B;--ink-soft:#55503f;--ink-muted:#6B6555;--ink-invert:#FBF9F5;
  --accent:#9C5A3C;--accent-hover:#834A30;--accent-soft:#EDE0D6;--focus:#2F6FB0;
  --error:#A32A22;--success:#3A6B47;
  --fs-xs:0.75rem;--fs-sm:0.875rem;--fs-base:1rem;--fs-lg:1.25rem;--fs-xl:1.563rem;
  --fs-2xl:1.953rem;--fs-3xl:2.441rem;--fs-4xl:3.052rem;--lh-tight:1.15;--lh-body:1.6;
  --ff-sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --ff-serif:"Iowan Old Style",Georgia,"Nanum Myeongjo",serif;
  --fw-reg:400;--fw-med:500;--fw-semi:600;
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:24px;--sp-6:32px;--sp-7:48px;--sp-8:64px;--sp-9:96px;
  --r-sm:6px;--r-md:10px;--r-lg:16px;--r-pill:999px;
  --shadow-1:0 1px 2px rgba(35,32,27,.05);--shadow-2:0 6px 20px rgba(35,32,27,.08);
  --container:1120px;--gutter:var(--sp-5);--tap:44px;
}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;overflow-x:hidden;}
body{background:var(--bg);color:var(--ink);font:var(--fw-reg) var(--fs-base)/var(--lh-body) var(--ff-sans);-webkit-font-smoothing:antialiased;}
a{color:var(--accent);text-decoration:underline;}
a:hover{color:var(--accent-hover);}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:var(--r-sm);}

.signup-wrap{max-width:440px;margin-inline:auto;padding-inline:var(--gutter);padding-block:var(--sp-9);}
.signup-head{text-align:center;margin-bottom:var(--sp-7);}
.signup-word{font-size:var(--fs-xl);font-weight:var(--fw-semi);color:var(--ink);display:block;margin-bottom:var(--sp-4);}
.signup-head h1{font-size:var(--fs-lg);color:var(--ink);margin:0 0 var(--sp-2);font-weight:var(--fw-semi);}
.signup-head p{color:var(--ink-soft);margin:0;}

.form{display:flex;flex-direction:column;gap:var(--sp-5);}
.field label{display:block;font-size:var(--fs-sm);font-weight:var(--fw-med);color:var(--ink);margin-bottom:var(--sp-2);}
.field input[type=email],.field input[type=password]{width:100%;min-height:48px;padding:12px 14px;border:1px solid var(--border-strong);border-radius:var(--r-md);background:var(--surface);color:var(--ink);font-size:var(--fs-base);font-family:inherit;}
.field input::placeholder{color:var(--ink-muted);}
.field input:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
.helper{font-size:var(--fs-sm);color:var(--ink-soft);margin:var(--sp-2) 0 0;}
.helper.error{color:var(--error);}
.req{color:var(--error);margin-left:2px;}

.terms{display:flex;align-items:center;gap:var(--sp-2);min-height:var(--tap);cursor:pointer;font-size:var(--fs-base);color:var(--ink);line-height:var(--lh-body);}
.terms input[type=checkbox]{width:20px;height:20px;flex:0 0 auto;accent-color:var(--accent);cursor:pointer;}
.terms a{color:var(--accent);text-decoration:underline;}

.submit-btn{width:100%;min-height:48px;background:var(--accent);color:var(--ink-invert);border:none;border-radius:var(--r-md);font-weight:var(--fw-semi);font-size:var(--fs-base);cursor:pointer;font-family:inherit;transition:background .18s ease;}
.submit-btn:hover{background:var(--accent-hover);}

.login-link{text-align:center;color:var(--ink-soft);margin:var(--sp-5) 0 0;}
.login-link a{display:inline-block;padding:10px var(--sp-2);color:var(--accent);text-decoration:underline;min-height:44px;line-height:24px;}
.foot-note{text-align:center;color:var(--ink-soft);font-size:var(--fs-sm);margin-top:var(--sp-6);}

@media (max-width:640px){
  .signup-wrap{padding-block:var(--sp-6);}
}
</style>
</head>
<body>

<main class="signup-wrap">
  <div class="signup-head">
    <span class="signup-word">무명 MUMYUNG</span>
    <h1>무명과 함께하기</h1>
    <p>가입은 1분이면 충분합니다.</p>
  </div>

  <form class="form" id="signup-form" novalidate onsubmit="return false">
    <div class="field">
      <label for="email">이메일<span class="req" aria-hidden="true">*</span></label>
      <input type="email" id="email" name="email" autocomplete="email" inputmode="email" placeholder="name@example.com" required>
    </div>

    <div class="field">
      <label for="password">비밀번호<span class="req" aria-hidden="true">*</span></label>
      <input type="password" id="password" name="password" autocomplete="new-password" placeholder="8자 이상" required aria-describedby="pw-help">
      <p class="helper" id="pw-help">8자 이상, 영문과 숫자를 포함해 주세요</p>
    </div>

    <div class="field">
      <label for="password2">비밀번호 확인<span class="req" aria-hidden="true">*</span></label>
      <input type="password" id="password2" name="password2" autocomplete="new-password" placeholder="비밀번호 재입력" required aria-describedby="pw2-help">
      <p class="helper" id="pw2-help">같은 비밀번호를 한 번 더 입력해 주세요</p>
    </div>

    <label class="terms" for="agree">
      <input type="checkbox" id="agree" name="agree" required>
      <span>(필수) <a href="#">이용약관</a> 및 <a href="#">개인정보 처리방침</a>에 동의합니다</span>
    </label>

    <button type="submit" class="submit-btn">가입하기</button>
  </form>

  <p class="login-link">이미 계정이 있으신가요? <a href="#">로그인</a></p>
  <p class="foot-note">가입하시면 신제품 소식을 가장 먼저 받아보실 수 있습니다.</p>
</main>

<script>
(function(){
  var pw=document.getElementById('password');
  var pw2=document.getElementById('password2');
  var help=document.getElementById('pw2-help');
  function check(){
    if(pw2.value && pw.value!==pw2.value){
      help.textContent='비밀번호가 일치하지 않습니다';
      help.classList.add('error');
    }else{
      help.textContent='같은 비밀번호를 한 번 더 입력해 주세요';
      help.classList.remove('error');
    }
  }
  pw.addEventListener('input',check);
  pw2.addEventListener('input',check);
})();
</script>
</body>
</html>
